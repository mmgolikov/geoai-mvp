name: Retired Founder UX Exact-Head QA Hardening

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    name: Historical workflow retirement notice
    runs-on: ubuntu-latest
    steps:
      - name: Report retirement
        shell: bash
        run: |
          set -euo pipefail
          echo "This historical self-mutating helper is retired."
          echo "Use the GeoAI Quality Gate for current verification."
          echo "No checkout, repository write, commit, push, deployment or external mutation is performed."

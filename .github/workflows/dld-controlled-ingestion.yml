name: DLD Controlled Ingestion Gate

on:
  pull_request:
    paths:
      - ".github/workflows/dld-controlled-ingestion.yml"
      - "data/external/catalog/dld_*.json"
      - "scripts/dld/**"
      - "docs/CR_DATA_01_DLD_DUBAI_PULSE_CONTROLLED_INGESTION_V1.md"
      - "docs/DLD_*.md"
      - "docs/sql/DLD_SCORING_FOUNDATION_V1_REVIEW_ONLY.sql"
      - "package.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dld-controlled-ingestion-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate-dld-controlled-ingestion:
    name: Validate fail-closed DLD ingestion controls
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify JavaScript syntax
        run: |
          node --check scripts/dld/dld-catalog-check.mjs
          node --check scripts/dld/prepare-dld-snapshot.mjs
          node --check scripts/dld/dld-controlled-ingestion-check.mjs

      - name: Validate DLD source catalogue
        run: npm run dld:catalog:check

      - name: Run DLD controlled-ingestion contract
        run: npm run test:dld-controlled-ingestion

      - name: Prove review-only SQL guard
        run: |
          grep -F "REVIEW ONLY: approved migration required" docs/sql/DLD_SCORING_FOUNDATION_V1_REVIEW_ONLY.sql
          if find supabase/migrations -maxdepth 1 -type f -iname '*dld*' | grep -q .; then
            echo "Unexpected executable DLD migration found in supabase/migrations" >&2
            exit 1
          fi

      - name: Prove source-dependent scoring remains disabled
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const catalog = JSON.parse(fs.readFileSync('data/external/catalog/dld_dubai_pulse_dataset_catalog.v1.json', 'utf8'));
          if (catalog.scoringAllowed !== false || catalog.evidenceUsedAllowed !== false || catalog.bulkAcquisitionAllowed !== false) {
            throw new Error('DLD root activation flags must remain false');
          }
          const active = catalog.datasets.filter((dataset) => dataset.scoringStatus === 'approved_aggregate_only');
          if (active.length !== 0) throw new Error(`Expected zero scoring-active DLD datasets, found ${active.length}`);
          console.log('DLD scoring activation remains fail-closed.');
          NODE

      - name: Add the unreleased DLD change receipt
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('CHANGELOG.md')
          text = path.read_text(encoding='utf-8')
          heading = '## Unreleased — CR-DATA-01 DLD / Dubai Pulse controlled ingestion foundation'
          if heading not in text:
              section = '''## Unreleased — CR-DATA-01 DLD / Dubai Pulse controlled ingestion foundation

- Audited the DLD Real Estate Data surface and scoring-relevant Dubai Pulse / Data Dubai families, and registered a controlled catalogue of 20 core and priority auxiliary datasets with explicit access, rights, privacy, custody, quality and scoring states.
- Added a fail-closed rights receipt, catalogue validator, streaming CSV quarantine preparer, automated control test, data contract, ingestion runbook, QA checklist, access-and-rights request package and a review-only restricted-fact / aggregate-feature SQL design with an intentional execution guard.
- Corrected the `geoai-dev` DLD metadata authority to `permission_required`, `metadata_only`, zero acquired records and source-dependent scoring/evidence disabled. No raw DLD row, schema migration, credential, Storage policy, Auth change, source activation, merge or Production deployment was performed.
- Added the dedicated read-only DLD Controlled Ingestion Gate. DLD-derived scoring remains blocked until written reusable rights, approved official access, private custody, trusted execution, canonical migration, independent quality/privacy acceptance and separate scoring activation approval exist.
- Mandatory output boundary: “Screening hypothesis; official validation required; not a legal, cadastral, zoning, planning or valuation conclusion.”

'''
              first_section = text.find('\n## ')
              if first_section < 0:
                  raise SystemExit('Cannot find first changelog section')
              text = text[:first_section + 1] + section + text[first_section + 1:]
              path.write_text(text, encoding='utf-8')
          PY

      - name: Generate document lifecycle sidecars
        run: npm run docs:lifecycle:generate

      - name: Upload generated document lifecycle sidecars
        uses: actions/upload-artifact@v4
        with:
          name: dld-document-lifecycle-sidecars
          if-no-files-found: error
          retention-days: 7
          path: |
            docs/DOCUMENT_LIFECYCLE_MANIFEST.json
            docs/DOCUMENT_ARCHIVE_INDEX.md

      - name: Commit changelog and generated lifecycle sidecars
        if: github.event_name == 'pull_request'
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          if git diff --quiet -- CHANGELOG.md docs/DOCUMENT_LIFECYCLE_MANIFEST.json docs/DOCUMENT_ARCHIVE_INDEX.md; then
            echo "Changelog and document lifecycle sidecars are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md docs/DOCUMENT_LIFECYCLE_MANIFEST.json docs/DOCUMENT_ARCHIVE_INDEX.md
          git commit -m "Record DLD controlled ingestion foundation"
          git push origin "HEAD:${HEAD_BRANCH}"

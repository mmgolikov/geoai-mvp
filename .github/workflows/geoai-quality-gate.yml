name: GeoAI Quality Gate

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: geoai-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: Static, API and data-honesty checks
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Prepare evidence directory
        run: mkdir -p artifacts

      - name: Install dependencies
        run: npm ci

      - name: Install WebKit for optimized product regression
        run: npx playwright install --with-deps webkit

      - name: Install physical PDF inspection tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes poppler-utils

      - name: Production dependency audit
        shell: bash
        run: |
          set -euo pipefail
          npm audit --omit=dev --audit-level=moderate | tee artifacts/npm-audit.txt

      - name: Record run metadata
        shell: bash
        run: |
          set -euo pipefail
          node --version | tee artifacts/node-version.txt
          npm --version | tee artifacts/npm-version.txt
          git rev-parse HEAD | tee artifacts/tested-commit-sha.txt

      - name: TypeScript check
        shell: bash
        run: |
          set -euo pipefail
          npm run lint | tee artifacts/typescript-check.txt

      - name: Access-decision checks
        shell: bash
        run: |
          set -euo pipefail
          npm run test:access-decision | tee artifacts/access-decision-check.txt

      - name: API access-guard checks
        shell: bash
        run: |
          set -euo pipefail
          npm run test:api-access-guards | tee artifacts/api-access-guard-check.txt

      - name: Server credential boundary
        shell: bash
        run: |
          set -euo pipefail
          npm run test:server-credential-boundary | tee artifacts/server-credential-boundary-check.txt

      - name: Secret hygiene
        shell: bash
        run: |
          set -euo pipefail
          npm run test:secret-hygiene | tee artifacts/secret-hygiene-check.txt

      - name: Readiness evidence boundary
        shell: bash
        run: |
          set -euo pipefail
          npm run test:readiness-evidence | tee artifacts/readiness-evidence-check.txt

      - name: Auth SSR transport checks
        shell: bash
        run: |
          set -euo pipefail
          npm run test:auth-ssr-transport | tee artifacts/auth-ssr-transport-check.txt

      - name: Supabase exact-target checks
        shell: bash
        run: |
          set -euo pipefail
          npm run test:supabase-exact-target | tee artifacts/supabase-exact-target-check.txt

      - name: Auth, MFA and Admin UI checks
        shell: bash
        run: |
          set -euo pipefail
          npm run test:auth-admin-ui | tee artifacts/auth-admin-ui-check.txt

      - name: Auth session E2E wiring checks
        shell: bash
        run: |
          set -euo pipefail
          npm run test:auth-session-e2e-contract | tee artifacts/auth-session-e2e-contract-check.txt
          node scripts/lighthouse-scope-check.mjs | tee artifacts/lighthouse-scope-check.txt

      - name: Auth mutation-origin checks
        shell: bash
        run: |
          set -euo pipefail
          npm run test:auth-mutation-origin | tee artifacts/auth-mutation-origin-check.txt

      - name: Request-scoped project read checks
        shell: bash
        run: |
          set -euo pipefail
          npm run test:request-scoped-project-read | tee artifacts/request-scoped-project-read-check.txt

      - name: Protected GET cache-boundary checks
        shell: bash
        run: |
          set -euo pipefail
          npm run test:private-cache-boundary | tee artifacts/private-cache-boundary-check.txt

      - name: Static RLS-plan checks
        shell: bash
        run: |
          set -euo pipefail
          npm run test:rls-plan | tee artifacts/rls-plan-check.txt

      - name: Migration security-surface checks
        shell: bash
        run: |
          set -euo pipefail
          npm run test:migration-security-surface | tee artifacts/migration-security-surface-check.txt

      - name: Canonical migration-chain checks
        shell: bash
        run: |
          set -euo pipefail
          npm run test:canonical-migration-chain | tee artifacts/canonical-migration-chain-check.txt

      - name: Synthetic upgrade-replay static contract
        shell: bash
        run: |
          set -euo pipefail
          npm run test:synthetic-upgrade-replay | tee artifacts/synthetic-upgrade-replay-static-check.txt

      - name: Local Supabase replay contract
        shell: bash
        run: |
          set -euo pipefail
          npm run test:supabase-local-contract | tee artifacts/supabase-local-contract-check.txt

      - name: Identity and authorization migration checks
        shell: bash
        run: |
          set -euo pipefail
          npm run test:identity-authorization-migration | tee artifacts/identity-authorization-migration-check.txt

      - name: Source custody migration checks
        shell: bash
        run: |
          set -euo pipefail
          npm run test:source-custody-migration | tee artifacts/source-custody-migration-check.txt

      - name: Auth/Admin activation migration checks
        shell: bash
        run: |
          set -euo pipefail
          npm run test:auth-admin-project-activation-rebuild | tee artifacts/auth-admin-project-activation-rebuild-check.txt

      - name: Foreign-key index hardening checks
        shell: bash
        run: |
          set -euo pipefail
          npm run test:foreign-key-index-hardening | tee artifacts/foreign-key-index-hardening-check.txt

      - name: Auth/Admin lifecycle remediation checks
        shell: bash
        run: |
          set -euo pipefail
          npm run test:auth-admin-lifecycle-remediation | tee artifacts/auth-admin-lifecycle-remediation-check.txt

      - name: Data API operator checks
        shell: bash
        run: |
          set -euo pipefail
          npm run test:data-api-operator | tee artifacts/data-api-operator-check.txt

      - name: Source connector foundation checks
        shell: bash
        run: |
          set -euo pipefail
          npm run test:source-connector-foundation | tee artifacts/source-connector-foundation-check.txt

      - name: Point-to-object prototype contract
        shell: bash
        run: |
          set -euo pipefail
          npm run test:point-to-object | tee artifacts/point-to-object-contract-check.txt

      - name: Point-to-object autocomplete contract
        shell: bash
        run: |
          set -euo pipefail
          npm run test:point-to-object-autocomplete | tee artifacts/point-to-object-autocomplete-check.txt

      - name: Point-to-object source and semantic analysis contracts
        shell: bash
        run: |
          set -euo pipefail
          npm run test:point-to-object-geocontext | tee artifacts/point-to-object-geocontext-check.txt

      - name: Point-to-object V5 interaction contract
        shell: bash
        run: |
          set -euo pipefail
          npm run test:point-to-object-v5-interaction | tee artifacts/point-to-object-v5-interaction-check.txt

      - name: Point-to-object trusted identity contract
        shell: bash
        run: |
          set -euo pipefail
          npm run test:point-to-object-trusted-identity | tee artifacts/point-to-object-trusted-identity-check.txt

      - name: Point-to-object Find contract
        shell: bash
        run: |
          set -euo pipefail
          npm run test:point-to-object-find | tee artifacts/point-to-object-find-check.txt

      - name: Point-to-object area-context contract
        shell: bash
        run: |
          set -euo pipefail
          npm run test:point-to-object-area-context | tee artifacts/point-to-object-area-context-check.txt

      - name: Point-to-object Create contract
        shell: bash
        run: |
          set -euo pipefail
          npm run test:point-to-object-create | tee artifacts/point-to-object-create-check.txt
          node --experimental-strip-types scripts/sprint20-create-geometry-check.ts | tee artifacts/sprint20-create-geometry-check.txt
          node --experimental-strip-types scripts/sprint20-create-preflight-parity-check.ts | tee artifacts/sprint20-create-preflight-parity-check.txt

      - name: Point-to-object runtime gates
        shell: bash
        run: |
          set -euo pipefail
          npm run test:point-to-object-runtime-gate | tee artifacts/point-to-object-runtime-gate-check.txt
          node scripts/quality20-production-gate-check.mjs | tee artifacts/quality20-production-gate-check.txt
          node scripts/quality20-password-only-check.mjs | tee artifacts/quality20-password-only-check.txt
          node scripts/quality20-profile-password-only-check.mjs | tee artifacts/quality20-profile-password-only-check.txt
          node --experimental-strip-types scripts/quality20-analysis-content-check.ts | tee artifacts/quality20-analysis-content-check.txt
          node scripts/quality20-review-fixes-check.mjs | tee artifacts/quality20-review-fixes-check.txt
          node scripts/quality20-evidence-receipt-check.mjs | tee artifacts/quality20-evidence-receipt-check.txt
          node scripts/quality20-frozen-case-check.mjs | tee artifacts/quality20-frozen-case-check.txt
          node scripts/quality20-acquisition-check.mjs | tee artifacts/quality20-acquisition-check.txt
          node scripts/quality20-bridge-check.mjs | tee artifacts/quality20-bridge-check.txt

      - name: Point-to-object saved Projects and live-producer contract
        shell: bash
        run: |
          set -euo pipefail
          npm run test:point-to-object-projects | tee artifacts/point-to-object-projects-check.txt

      - name: Point-to-object map-replacement contract
        shell: bash
        run: |
          set -euo pipefail
          npm run test:point-to-object-map-replacement | tee artifacts/point-to-object-map-replacement-check.txt

      - name: Point-to-object V6 architecture contracts
        shell: bash
        run: |
          set -euo pipefail
          npm run test:point-to-object-v6-contracts | tee artifacts/point-to-object-v6-contract-check.txt

      - name: User-profile contract
        shell: bash
        run: |
          set -euo pipefail
          npm run test:user-profile | tee artifacts/user-profile-check.txt

      - name: Workspace-panel source checks
        shell: bash
        run: |
          set -euo pipefail
          npm run test:workspace-panel | tee artifacts/workspace-panel-check.txt

      - name: AOI integrity adversarial checks
        shell: bash
        run: |
          set -euo pipefail
          npm run test:aoi-integrity | tee artifacts/aoi-integrity-check.txt

      - name: Spatial B1 contract checks
        shell: bash
        env:
          SPATIAL_B1_CONTRACT_EVIDENCE_DIR: artifacts/spatial-b1
        run: |
          set -euo pipefail
          npm run test:spatial-b1 | tee artifacts/spatial-b1-check.txt

      - name: Spatial B2A fallback checks
        shell: bash
        env:
          SPATIAL_B2_EVIDENCE_DIR: artifacts/spatial-b2a
        run: |
          set -euo pipefail
          npm run test:spatial-b2a | tee artifacts/spatial-b2a-check.txt

      - name: Data-honesty claim scan
        shell: bash
        run: |
          set -euo pipefail
          npm run test:data-honesty | tee artifacts/data-honesty-check.txt

      - name: Product System v3.2 design foundation contract
        shell: bash
        run: |
          set -euo pipefail
          npm run test:design-foundation | tee artifacts/design-foundation-contract-check.txt

      - name: Documentation current-truth checks
        shell: bash
        run: |
          set -euo pipefail
          npm run test:documentation-current-truth | tee artifacts/documentation-current-truth-check.txt

      - name: Documentation current-truth fixture checks
        shell: bash
        run: |
          set -euo pipefail
          npm run test:documentation-current-truth-fixtures | tee artifacts/documentation-current-truth-fixtures.txt

      - name: API route inventory source contract
        shell: bash
        run: |
          set -euo pipefail
          npm run test:api-route-inventory | tee artifacts/api-route-inventory-source-check.txt

      - name: Public request boundary checks
        shell: bash
        run: |
          set -euo pipefail
          npm run test:public-request-contract | tee artifacts/public-request-contract-check.txt

      - name: Documentation lifecycle manifest
        shell: bash
        run: |
          set -euo pipefail
          npm run test:document-lifecycle | tee artifacts/document-lifecycle-check.txt

      - name: Project isolation source contract
        shell: bash
        run: |
          set -euo pipefail
          npm run test:project-isolation | tee artifacts/project-isolation-check.txt

      - name: Public report-package projection contract
        shell: bash
        run: |
          set -euo pipefail
          npm run test:report-package-public-contract | tee artifacts/report-package-public-contract-check.txt

      - name: Runtime status contract checks
        shell: bash
        run: |
          set -euo pipefail
          npm run test:runtime-status-contract | tee artifacts/runtime-status-contract-check.txt

      - name: Runtime source-pack contract checks
        shell: bash
        run: |
          set -euo pipefail
          npm run test:runtime-source-pack | tee artifacts/runtime-source-pack-check.txt

      - name: Sprint 10 offline isolation and portable-runtime contracts
        shell: bash
        run: |
          set -euo pipefail
          node scripts/point-object-cloud-persistence-check.mjs | tee artifacts/sprint10-cloud-contract.txt
          node --experimental-transform-types scripts/point-object-cloud-import-check.ts | tee artifacts/sprint10-cloud-import-contract.txt
          node --experimental-transform-types scripts/point-object-cloud-client-check.ts | tee artifacts/sprint10-cloud-client-contract.txt
          node scripts/sprint10-cloud-concurrency-check.mjs | tee artifacts/sprint10-cloud-race-static-contract.txt
          node --experimental-transform-types scripts/sprint10-cloud-live-acceptance-check.mjs | tee artifacts/sprint10-cloud-live-static-contract.txt
          node --experimental-transform-types scripts/point-object-source-middleware-auth-deadline-check.mjs | tee artifacts/source-middleware-deadline-contract.txt
          node --experimental-transform-types scripts/point-object-request-auth-deadline-integration-check.mjs | tee artifacts/source-request-auth-deadline-integration.txt
          npm run test:self-host-runtime | tee artifacts/sprint10-self-host-contract.txt
          node scripts/sprint10-portable-readiness-load-check.mjs | tee artifacts/sprint10-portable-load-contract.txt
          node --experimental-transform-types scripts/sprint10-analysis-result-evidence-check.ts | tee artifacts/sprint10-analysis-evidence-contract.txt
          node --experimental-transform-types scripts/sprint10-depth-cycle-evidence-check.ts | tee artifacts/sprint10-depth-cycle-evidence-contract.txt
          node --experimental-transform-types scripts/sprint10-goal-depth-cycle-check.ts | tee artifacts/sprint10-goal-depth-cycle-contract.txt
          node --experimental-transform-types scripts/sprint10-live-budget-check.ts | tee artifacts/sprint10-live-budget-contract.txt
          node --experimental-transform-types scripts/sprint20-conservative-budget-check.ts | tee artifacts/sprint20-conservative-budget-contract.txt
          node --experimental-transform-types scripts/sprint10-live-journey-offline-check.ts | tee artifacts/sprint10-live-journey-contract.txt
          node --experimental-transform-types scripts/sprint10-live-journey-runner-offline-check.mjs | tee artifacts/sprint10-live-runner-contract.txt
          node --experimental-transform-types scripts/sprint10-live-journey-diagnostics-check.mjs | tee artifacts/sprint10-live-diagnostics-contract.txt
          npm run test:point-to-object-source-deadline | tee artifacts/sprint10-source-deadline-contract.txt
          node --experimental-transform-types scripts/source-request-trace-check.mjs | tee artifacts/source-request-trace-contract.txt
          npm run test:sprint10-regional-diagnostics | tee artifacts/sprint10-regional-diagnostics-contract.txt
          node scripts/sprint10-real-password-auth-diagnostics-check.mjs | tee artifacts/sprint10-auth-diagnostics-contract.txt
          node scripts/sprint10-real-password-auth-check.mjs | tee artifacts/sprint10-password-auth-contract.txt
          node --experimental-transform-types scripts/sprint10-hosted-auth-probe-check.mjs | tee artifacts/sprint10-hosted-auth-contract.txt
          node --experimental-transform-types scripts/sprint10-hosted-auth-live-check.mjs | tee artifacts/sprint10-combined-auth-contract.txt
          node --experimental-strip-types scripts/product-https-harness-check.mjs | tee artifacts/product-https-harness-contract.txt

      - name: Browser demo-public product flow
        shell: bash
        env:
          NEXT_PUBLIC_AUTH_MODE: demo_public
          GEOAI_ACCESS_ENFORCEMENT_MODE: soft
          GEOAI_ALLOW_DEMO_PUBLIC: "true"
          GEOAI_E2E_BASE_URL: http://127.0.0.1:3100
        run: |
          set -euo pipefail
          npm run dev -- -p 3100 > /tmp/geoai-e2e-next.log 2>&1 &
          APP_PID=$!
          cleanup() {
            cp /tmp/geoai-e2e-next.log artifacts/auth-session-e2e-next.log 2>/dev/null || true
            kill "$APP_PID" 2>/dev/null || true
          }
          trap cleanup EXIT

          READY=0
          for attempt in $(seq 1 90); do
            if curl --fail --silent --show-error http://127.0.0.1:3100/login > /dev/null; then
              READY=1
              break
            fi
            if ! kill -0 "$APP_PID" 2>/dev/null; then
              cat /tmp/geoai-e2e-next.log
              exit 1
            fi
            sleep 1
          done

          if [ "$READY" -ne 1 ]; then
            cat /tmp/geoai-e2e-next.log
            echo "E2E app did not become ready within 90 seconds." >&2
            exit 1
          fi

          google-chrome --version | tee artifacts/google-chrome-version.txt
          PLAYWRIGHT_JUNIT_OUTPUT_FILE=artifacts/point-to-object-product-e2e-junit.xml npm run test:e2e:point-to-object-v5:demo -- --retries=0 --output=artifacts/playwright-point-to-object | tee artifacts/point-to-object-v5-demo-e2e.txt
          npm run test:e2e:auth-session:demo -- --retries=0 | tee artifacts/auth-session-demo-e2e.txt
          npx playwright test tests/e2e/point-object-cloud-sync.spec.ts --grep='demo/anonymous' --workers=1 --retries=0 --fail-on-flaky-tests | tee artifacts/cloud-demo-isolation-e2e.txt

      - name: Browser explicit cloud persistence isolation (mocked provider)
        shell: bash
        run: |
          set -euo pipefail
          npx playwright test --config=playwright.cloud-projects.config.ts --workers=1 --retries=0 --fail-on-flaky-tests | tee artifacts/cloud-projects-e2e.txt

      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          npm run build | tee artifacts/build.txt

      - name: Vercel output-file tracing contract
        shell: bash
        run: |
          set -euo pipefail
          npm run test:vercel-output-tracing | tee artifacts/vercel-output-tracing-check.txt

      - name: Start built app and run API/route smoke
        shell: bash
        run: |
          set -euo pipefail
          npm run start -- -H 127.0.0.1 -p 3000 > /tmp/geoai-next.log 2>&1 &
          APP_PID=$!
          trap 'kill "$APP_PID" 2>/dev/null || true' EXIT

          READY=0
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error http://127.0.0.1:3000/api/health > /dev/null; then
              READY=1
              break
            fi
            if ! kill -0 "$APP_PID" 2>/dev/null; then
              cat /tmp/geoai-next.log
              exit 1
            fi
            sleep 1
          done

          if [ "$READY" -ne 1 ]; then
            cat /tmp/geoai-next.log
            echo "Built app did not become ready within 60 seconds." >&2
            exit 1
          fi

          GEOAI_TEST_BASE_URL=http://127.0.0.1:3000 npm run test:api-contract | tee artifacts/api-contract-check.txt
          GEOAI_TEST_BASE_URL=http://127.0.0.1:3000 node scripts/source-framework-request-check.mjs | tee artifacts/source-framework-request-check.txt
          GEOAI_TEST_BASE_URL=http://127.0.0.1:3000 npm run test:security-headers | tee artifacts/security-header-check.txt
          GEOAI_TEST_BASE_URL=http://127.0.0.1:3000 npm run test:api-route-inventory | tee artifacts/api-route-inventory-runtime-check.txt

          : > artifacts/route-smoke.txt
          routes=(
            "/"
            "/workspace"
            "/projects"
            "/explore"
            "/login"
            "/request-access"
            "/login?next=/workspace&intent=request"
            "/register"
            "/mfa"
            "/onboarding"
            "/admin"
            "/demo"
            "/api/health"
            "/api/db/health"
            "/api/platform/activation-status"
            "/api/pilot-backend/status"
            "/reports/seeded-analysis-dubai-marina-report/print"
            "/reports/seeded-comparison-dubai-shortlist-report/print"
          )
          declare -A expected_status
          for route in "${routes[@]}"; do
            expected_status["$route"]="200"
          done
          expected_status["/register"]="307"
          expected_status["/mfa"]="307"
          expected_status["/demo"]="307"
          expected_status["/explore"]="307"
          expected_status["/login?next=/workspace&intent=request"]="307"

          declare -A expected_location
          expected_location["/register"]="/login"
          expected_location["/mfa"]="/login"
          expected_location["/demo"]="/prototype/point-to-object"
          expected_location["/explore"]="/prototype/point-to-object"
          expected_location["/login?next=/workspace&intent=request"]="/request-access"

          for route in "${routes[@]}"; do
            code=$(curl --silent --show-error --max-time 20 --output /dev/null --write-out '%{http_code}' "http://127.0.0.1:3000${route}")
            printf '%s\t%s\n' "$code" "$route" | tee -a artifacts/route-smoke.txt
            if [ "$code" != "${expected_status[$route]}" ]; then
              echo "Unexpected HTTP status for $route: got $code, expected ${expected_status[$route]}" >&2
              exit 1
            fi
            if [ -n "${expected_location[$route]:-}" ]; then
              redirect_url=$(curl --silent --show-error --max-time 20 --output /dev/null --write-out '%{redirect_url}' "http://127.0.0.1:3000${route}")
              if [ "$redirect_url" != "http://127.0.0.1:3000${expected_location[$route]}" ]; then
                echo "Unexpected redirect for $route: got $redirect_url, expected http://127.0.0.1:3000${expected_location[$route]}" >&2
                exit 1
              fi
            fi
          done

          auth_smoke_base="http://localhost:3000"
          admin_code=$(curl --silent --show-error --max-time 20 --output /dev/null --write-out '%{http_code}' -X POST -H "Origin: ${auth_smoke_base}" -H 'Sec-Fetch-Site: same-origin' -H 'Content-Type: application/json' --data '{}' "${auth_smoke_base}/api/admin")
          invitation_code=$(curl --silent --show-error --max-time 20 --output /dev/null --write-out '%{http_code}' -X POST -H "Origin: ${auth_smoke_base}" -H 'Sec-Fetch-Site: same-origin' -H 'Content-Type: application/json' --data '{}' "${auth_smoke_base}/api/onboarding/invitation")
          stage_code=$(curl --silent --show-error --max-time 20 --output /dev/null --write-out '%{http_code}' -X POST -H "Origin: ${auth_smoke_base}" -H 'Sec-Fetch-Site: same-origin' -H 'Content-Type: application/json' --data '{"token":"aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"}' "${auth_smoke_base}/api/onboarding/invitation/stage")
          logout_code=$(curl --silent --show-error --max-time 20 --output /dev/null --write-out '%{http_code}' -X POST -H "Origin: ${auth_smoke_base}" -H 'Sec-Fetch-Site: same-origin' -H 'Content-Type: application/json' --data '{}' "${auth_smoke_base}/api/auth/logout")
          cross_origin_code=$(curl --silent --show-error --max-time 20 --output /dev/null --write-out '%{http_code}' -X POST -H 'Origin: https://attacker.invalid' -H 'Sec-Fetch-Site: cross-site' -H 'Content-Type: application/json' --data '{}' "${auth_smoke_base}/api/auth/logout")
          printf '%s\t%s\n' "$admin_code" "/api/admin POST demo-mode denial" "$invitation_code" "/api/onboarding/invitation POST demo-mode denial" "$stage_code" "/api/onboarding/invitation/stage POST demo-mode denial" "$logout_code" "/api/auth/logout POST demo-mode denial" "$cross_origin_code" "/api/auth/logout POST cross-origin denial" | tee -a artifacts/route-smoke.txt
          if [ "$admin_code" != "401" ] || [ "$invitation_code" != "401" ] || [ "$stage_code" != "503" ] || [ "$logout_code" != "503" ] || [ "$cross_origin_code" != "403" ]; then
            echo "Auth/Admin demo-mode negative smoke returned an unexpected status." >&2
            exit 1
          fi

          npx lighthouse http://127.0.0.1:3000/ \
            --quiet \
            --output=json \
            --output-path=artifacts/lighthouse-mobile.json \
            --only-categories=performance,accessibility,best-practices,seo \
            --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage --disable-gpu"
          npx lighthouse 'http://127.0.0.1:3000/login?next=/workspace&intent=demo' \
            --quiet \
            --preset=desktop \
            --output=json \
            --output-path=artifacts/lighthouse-desktop.json \
            --only-categories=performance,accessibility,best-practices,seo \
            --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage --disable-gpu"
          npx lighthouse http://127.0.0.1:3000/projects \
            --quiet \
            --output=json \
            --output-path=artifacts/lighthouse-mobile-projects.json \
            --only-categories=performance,accessibility,best-practices,seo \
            --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage --disable-gpu"
          npx lighthouse http://127.0.0.1:3000/workspace \
            --quiet \
            --preset=desktop \
            --output=json \
            --output-path=artifacts/lighthouse-desktop-workspace-criteria.json \
            --only-categories=performance,accessibility,best-practices,seo \
            --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage --disable-gpu"
          npx lighthouse http://127.0.0.1:3000/request-access \
            --quiet \
            --preset=desktop \
            --output=json \
            --output-path=artifacts/lighthouse-desktop-request-access.json \
            --only-categories=performance,accessibility,best-practices,seo \
            --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage --disable-gpu"
          npx lighthouse http://127.0.0.1:3000/profile \
            --quiet \
            --preset=desktop \
            --output=json \
            --output-path=artifacts/lighthouse-desktop-profile.json \
            --only-categories=performance,accessibility,best-practices,seo \
            --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage --disable-gpu"
          npm run test:lighthouse-budget -- --public-demo | tee artifacts/lighthouse-budget-check.txt

          GEOAI_PDF_BASE_URL=http://127.0.0.1:3000 npm run evidence:pdf-print | tee artifacts/pdf-print-check.txt
          cp /tmp/geoai-next.log artifacts/pdf-print-evidence/next-application.log
          npm run test:system-stabilization-audit | tee artifacts/system-stabilization-audit-check.txt

      - name: Optimized HTTPS product WebKit
        shell: bash
        env:
          NEXT_PUBLIC_AUTH_MODE: demo_public
          GEOAI_ACCESS_ENFORCEMENT_MODE: soft
          GEOAI_ALLOW_DEMO_PUBLIC: "true"
        run: |
          set -euo pipefail
          # Full product assertions over loopback HTTPS with the unchanged CSP;
          # no Node-side navigation replay or external service requests.
          NODE_ENV=production node scripts/sprint10-local-https.mjs > /tmp/geoai-product-https.log 2>&1 &
          PRODUCT_HTTPS_PID=$!
          cleanup() {
            kill "$PRODUCT_HTTPS_PID" 2>/dev/null || true
            wait "$PRODUCT_HTTPS_PID" 2>/dev/null || true
            cp /tmp/geoai-product-https.log artifacts/product-https-runtime.log 2>/dev/null || true
          }
          trap cleanup EXIT
          READY=0
          for attempt in $(seq 1 60); do
            if ! kill -0 "$PRODUCT_HTTPS_PID" 2>/dev/null; then
              cat /tmp/geoai-product-https.log
              exit 1
            fi
            if curl --insecure --fail --silent --show-error --max-time 2 https://127.0.0.1:3443/api/health > /dev/null; then
              kill -0 "$PRODUCT_HTTPS_PID"
              READY=1
              break
            fi
            sleep 1
          done
          if [ "$READY" -ne 1 ]; then
            cat /tmp/geoai-product-https.log
            echo "Optimized loopback HTTPS app did not become ready within the bounded readiness check." >&2
            exit 1
          fi
          PLAYWRIGHT_JUNIT_OUTPUT_FILE=artifacts/point-to-object-webkit-product-junit.xml \
            npm run test:e2e:point-to-object-v5:demo -- --config playwright.product-https.config.ts --workers=1 --retries=0 \
            --output=artifacts/playwright-point-to-object-webkit | tee artifacts/point-to-object-webkit-product.txt

      - name: Preserve application log
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/geoai-next.log ]; then
            cp /tmp/geoai-next.log artifacts/next-runtime.log
          fi

      - name: Upload release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: geoai-quality-evidence-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14

  protected-browser:
    name: Anonymous protected SSR and API browser boundaries
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_AUTH_MODE: supabase_auth
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_GEOAI_ALLOW_LOCAL_SUPABASE: "true"
      GEOAI_ACCESS_ENFORCEMENT_MODE: hard
      GEOAI_ALLOW_DEMO_PUBLIC: "false"
      E2E_KEY_SUFFIX: geoai_ci_browser_contract_only
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies and browser engine
        run: |
          npm ci
          npx playwright install --with-deps webkit
          mkdir -p artifacts
          git rev-parse HEAD > artifacts/protected-tested-commit-sha.txt
      - name: Protected anonymous entry and byte preservation
        shell: bash
        run: |
          set -euo pipefail
          npm run test:e2e:auth-persona:protected -- --retries=0 | tee artifacts/auth-persona-protected.txt
      - name: Build protected localhost fixture
        shell: bash
        run: |
          set -euo pipefail
          export NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY="sb_publishable_${E2E_KEY_SUFFIX}"
          npm run build | tee artifacts/protected-build.txt
      - name: Protected optimized HTTPS Chrome and WebKit boundaries
        shell: bash
        run: |
          set -euo pipefail
          export NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY="sb_publishable_${E2E_KEY_SUFFIX}"
          NODE_ENV=production node scripts/sprint10-local-https.mjs > /tmp/geoai-protected-https.log 2>&1 &
          APP_PID=$!
          cleanup() {
            kill "$APP_PID" 2>/dev/null || true
            wait "$APP_PID" 2>/dev/null || true
            cp /tmp/geoai-protected-https.log artifacts/protected-https-server.log
          }
          trap cleanup EXIT
          READY=0
          for attempt in $(seq 1 60); do
            if curl --insecure --fail --silent https://127.0.0.1:3443/login > /dev/null; then
              READY=1
              break
            fi
            if ! kill -0 "$APP_PID" 2>/dev/null; then
              cat /tmp/geoai-protected-https.log
              exit 1
            fi
            sleep 1
          done
          if [ "$READY" -ne 1 ]; then
            cat /tmp/geoai-protected-https.log
            exit 1
          fi
          npm run test:e2e:auth-boundary:protected -- --retries=0 | tee artifacts/auth-boundary-protected.txt
          npx lighthouse https://127.0.0.1:3443/login \
            --quiet \
            --preset=desktop \
            --output=json \
            --output-path=artifacts/lighthouse-desktop-login.json \
            --only-categories=performance,accessibility,best-practices,seo \
            --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage --disable-gpu --ignore-certificate-errors"
          npm run test:lighthouse-budget -- --protected-login | tee artifacts/lighthouse-protected-login-budget-check.txt
      - name: Upload protected browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: geoai-protected-browser-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14

  database-replay:
    name: Supabase clean replay, synthetic upgrade rehearsal and pgTAP personas
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: "true"
      SUPABASE_TELEMETRY_DISABLED: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Prepare database evidence directory
        run: mkdir -p artifacts/database

      - name: Install pinned dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm ci | tee artifacts/database/npm-ci.txt

      - name: Verify pinned Supabase CLI
        shell: bash
        run: |
          set -euo pipefail
          npx supabase --version | tee artifacts/database/supabase-cli-version.txt
          test "$(npx supabase --version)" = "2.109.1"
          git rev-parse HEAD | tee artifacts/database/tested-commit-sha.txt
          cp supabase/migration-ledger-baseline.json artifacts/database/migration-ledger-baseline.json

      - name: Start local Supabase and apply canonical migrations
        shell: bash
        run: |
          set -euo pipefail
          npm run supabase:local:start | tee artifacts/database/clean-start.txt

      - name: Prove deterministic clean reset
        shell: bash
        run: |
          set -euo pipefail
          npm run supabase:local:reset | tee artifacts/database/clean-reset.txt

      - name: Run clean-replay database persona tests
        shell: bash
        run: |
          set -euo pipefail
          npm run supabase:test:db | tee artifacts/database/clean-replay-pgtap.txt

      - name: Synthetic ledger-prefix upgrade rehearsal (not live-clone certification)
        shell: bash
        run: |
          set -euo pipefail
          npm run supabase:test:synthetic-upgrade-replay | tee artifacts/database/synthetic-upgrade-rehearsal.txt

      - name: Run synthetic-upgrade database persona tests
        shell: bash
        run: |
          set -euo pipefail
          npm run supabase:test:db | tee artifacts/database/synthetic-upgrade-pgtap.txt

      - name: Stop local Supabase
        if: always()
        shell: bash
        run: |
          set -o pipefail
          if [ -x node_modules/.bin/supabase ]; then
            npm run supabase:local:stop | tee artifacts/database/stop.txt
          else
            echo "Supabase stop skipped because the pinned CLI was not installed." | tee artifacts/database/stop.txt
          fi

      - name: Upload database replay evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: geoai-database-evidence-${{ github.run_id }}
          path: artifacts/database/
          if-no-files-found: warn
          retention-days: 14

name: Trigger CR 10.10 Patch

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'fix/unified-teal-and-cockpit-labels'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/unified-teal-and-cockpit-labels
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Execute CR 10.10 patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          lines = Path('.github/workflows/apply-cr-10-10-v2.yml').read_text(encoding='utf-8').splitlines()
          positions = [i for i, line in enumerate(lines) if line.strip() == 'run: |']
          if len(positions) != 1:
              raise SystemExit(f'Expected one run block, found {len(positions)}')
          start = positions[0] + 1
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines[start:]) + '\n'
          Path('/tmp/apply-cr-10-10-v2.sh').write_text(script, encoding='utf-8')
          PY
          bash /tmp/apply-cr-10-10-v2.sh
